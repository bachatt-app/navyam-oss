task: hinglish_finance
dataset_path: json
dataset_kwargs:
  data_files:
    test: tasks/hinglish_finance/items.jsonl
test_split: test
output_type: multiple_choice
doc_to_text: "{{prompt}}\nJawab:"
doc_to_choice: "{{choices}}"
doc_to_target: answer_idx
should_decontaminate: true
doc_to_decontamination_query: prompt
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  description: >
    First-party Hinglish code-switch finance comprehension: everyday Indian
    money situations written the way people actually text — Roman-script
    Hindi mixed with English terms. Tests whether the model follows
    code-switched financial reasoning, not just translation.
